[project]
name = "literature-priors-cad"
version = "1.0.0"
description = "Published diagnostic statistics as Bayesian priors for coronary artery disease: prior-data conflict and a small-sample window"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tejas Tovinkere Pattabhi" }]
requires-python = ">=3.13,<3.14"
# Exact versions used to produce the results in results/
dependencies = [
    "pymc==6.3.2",
    "pytensor==3.3.4",
    "numba==0.62.1",
    "llvmlite==0.45.1",
    "arviz==1.3.0",
    "arviz-base==1.3.1",
    "arviz-stats==1.3.3",
    "arviz-plots==1.3.2",
    "xarray==2026.9.0",
    "numpy==2.3.5",
    "pandas==3.1.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["black==26.10.1", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
